<!DOCTYPE html>
<html lang="zh-Hans">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="https://cdn.grace-word.com/assets/icons/favicon.png">
    <title>来自恩语 App 的分享</title>
    <meta property="og:site_name" content="恩语">
    <meta property="og:type" content="article">
    <meta property="og:url"
          content="https://grace-word.com/share/eb943e5d-8553-4b89-9f20-59ca732cb7b6">

    <meta property="og:image"
          content="https://cdn.grace-word.com/letter/9988f8869a864680862299583fcc57ff.webp">
    <meta property="og:image:alt" content="恩语分享">

    <meta property="og:title" content="来自恩语 App 的分享">
    <meta property="og:description" content="为你恩典留痕，助你与神同行">
    <meta name="twitter:card" content="summary_large_image">
    <script src="https://cdn.jsdelivr.net/npm/marked@11.1.1/marked.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            color: #333333;
            line-height: 1.6;
            padding: 0;
            margin: 0;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            background-color: white;
            min-height: 100vh;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
            position: relative;
            padding-bottom: 180px;
        }
        .message-block.user .message-content {
            white-space: pre-wrap;
        }
        .header-image {
            width: 100%;
            height: 200px;
            object-fit: cover;
            display: block;
        }

        .content {
            padding: 20px;
        }

        .bible {
            text-decoration-style: dotted;
            color: #CF4B40;
        }

        .message-block {
            margin-bottom: 20px;
            padding: 16px;
            border-radius: 8px;
            line-height: 1.8;
            font-size: 17px;
            max-width: 80%;
            width: fit-content;
        }

        .message-block.user {
            background-color: #FFF8F7;
            border-left: 3px solid #FFF8F7;
            color: #000000;
            margin-left: auto;
            margin-right: 0;
            position: relative;
        }

        .message-block.user::after {
            content: '';
            position: absolute;
            bottom: 8px;
            right: -8px;
            width: 0;
            height: 0;
            border-left: 8px solid #FFF8F7;
            border-top: 8px solid transparent;
            border-bottom: 0;
        }

        .message-block.assistant {

            color: #333333;
            margin-left: 0;
            margin-right: auto;
        }

        .message-content {

            word-wrap: break-word;
        }


        .message-block.assistant .message-content h1,
        .message-block.assistant .message-content h2,
        .message-block.assistant .message-content h3,
        .message-block.assistant .message-content h4,
        .message-block.assistant .message-content h5,
        .message-block.assistant .message-content h6 {
            margin-top: 16px;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .message-block.assistant .message-content h1 { font-size: 1.5em; }
        .message-block.assistant .message-content h2 { font-size: 1.3em; }
        .message-block.assistant .message-content h3 { font-size: 1.1em; }

        .message-block.assistant .message-content p {
            margin-bottom: 8px;
        }

        .message-block.assistant .message-content ul,
        .message-block.assistant .message-content ol {
            margin-left: 20px;
            margin-bottom: 8px;
        }

        .message-block.assistant .message-content li {
            margin-bottom: 4px;
        }

        .message-block.assistant .message-content code {
            background-color: #f5f5f5;
            padding: 2px 6px;
            border-radius: 3px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.9em;
        }

        .message-block.assistant .message-content pre {
            background-color: #f5f5f5;
            padding: 12px;
            border-radius: 6px;
            overflow-x: auto;
            margin-bottom: 8px;
        }

        .message-block.assistant .message-content pre code {
            background-color: transparent;
            padding: 0;
        }

        .message-block.assistant .message-content blockquote {
            border-left: 3px solid #ddd;
            padding-left: 12px;
            margin-left: 0;
            margin-bottom: 8px;
            color: #666;
        }

        .message-block.assistant .message-content a {
            color: #CF4B40;
        }

        .message-block.assistant .message-content strong {
            font-weight: 600;
        }

        .message-block.assistant .message-content em {
            font-style: italic;
        }


        .hymn-container {
            padding: 0;
        }

        .hymn-title {
            font-size: 20px;
            font-weight: 600;
            color: #333333;
            margin-bottom: 10px;
        }

        .hymn-actions {
            display: flex;
            gap: 8px;
            align-items: center;
            margin-bottom: 10px;
            flex-wrap: wrap;
        }

        .hymn-action {
            color: #CF4B3F;
            text-decoration: none;
            font-size: 17px;
            font-weight: 500;
            transition: opacity 0.3s ease;
        }

        .hymn-action:hover {
            opacity: 0.7;
        }

        .hymn-action-separator {
            color: #CF4B40;
            font-size: 14px;
        }

        .hymn-metadata {
            font-size: 15px;
            color: #B1B1B1;
            margin-bottom: 8px;
            line-height: 1.5;
        }

        .hymn-lyrics-wrapper {
            position: relative;
        }

        .hymn-lyrics {
            font-size: 17px;
            color: #333333;
            line-height: 2;
            white-space: pre-wrap;
            max-height: 300px;
            overflow: hidden;
            position: relative;
            transition: max-height 0.3s ease;
        }

        .hymn-lyrics.expanded {
            max-height: none;
        }

        .hymn-lyrics.collapsed::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 60px;
            background: linear-gradient(to bottom, transparent, #FAFAFA);
        }

        .hymn-toggle-button {
            margin-top: 8px;
            color: #CF4B40;
            font-size: 14px;
            cursor: pointer;
            user-select: none;
            text-decoration: none;
            float: right;
        }

        .hymn-toggle-button:hover {
            opacity: 0.7;
        }

        .hymn-lyrics-wrapper::after {
            content: '';
            display: table;
            clear: both;
        }

        .hymn-copyright {
            font-size: 17px;
            color: #B1B1B1;
        }

        .footer-wrapper {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            max-width: 600px;
            width: 100%;
            background-color: white;
        }

        .separator-line {
            height: 1px;
            background-color: #eee;
            margin: 0 20px;
        }

        .footer {
            padding: 20px;
        }

        .app-info {
            display: flex;
            align-items: flex-start;
            margin-bottom: 16px;
        }

        .button-wrapper {
            display: flex;
            justify-content: center;
        }

        .app-icon {
            width: 40px;
            height: 40px;
            margin-right: 8px;
            border-radius: 6px;
            flex-shrink: 0;
        }

        .app-info-text {
            display: flex;
            flex-direction: column;
        }

        .app-name {
            font-size: 14px;
            color: #B1B1B1;

        }

        .download-button {
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #fff;
            color: #CF4B40;
            text-decoration: none;
            border-radius: 21px;
            font-size: 14px;
            font-weight: 600;
            border: 1px solid #CF4B40;
            transition: all 0.3s ease;
            width: 315px;
            height: 42px;
        }

        .download-button:hover {
            background-color: #e74c3c;
            color: white;
        }

        .error-message {
            padding: 40px 20px;
            text-align: center;
            color: #999;
            font-size: 16px;
        }

        @media (max-width: 640px) {
            .container {
                box-shadow: none;
            }

            .content {
                padding: 16px;
            }

            .message-block {
                padding: 14px;
                font-size: 17px;
            }
        }
    </style>
</head>
<body>
<div class="container">
    <img src="{{headerUrl}}" alt="Header Image" class="header-image">

    <div class="content">
        {{shareData}}
    </div>
</div>
<script>

    document.addEventListener('DOMContentLoaded', function() {
        const markdownElements = document.querySelectorAll('.markdown-content');

<!--        markdownElements.forEach(function(element) {-->
<!--            const markdownText = element.getAttribute('data-markdown');-->
<!--            if (markdownText && typeof marked !== 'undefined') {-->
<!--                element.innerHTML = marked.parse(markdownText);-->
<!--            } else {-->
<!--                element.textContent = markdownText;-->
<!--            }-->

<!--        });-->

        markdownElements.forEach((element, index) => {
            const originalText = element.textContent;
            element.innerHTML = marked.parse(originalText);
        });


        const hymnWrappers = document.querySelectorAll('.hymn-lyrics-wrapper');

        hymnWrappers.forEach(function(wrapper) {
            const hymnLyrics = wrapper.querySelector('.hymn-lyrics');
            const hymnToggle = wrapper.querySelector('.hymn-toggle-button');

            if (hymnLyrics && hymnToggle) {

                if (hymnLyrics.scrollHeight > 300) {
                    hymnToggle.style.display = 'inline-block';

                    hymnToggle.addEventListener('click', function(e) {
                        e.preventDefault();

                        if (hymnLyrics.classList.contains('collapsed')) {
                            hymnLyrics.classList.remove('collapsed');
                            hymnLyrics.classList.add('expanded');
                            hymnToggle.textContent = '收起';
                        } else {
                            hymnLyrics.classList.remove('expanded');
                            hymnLyrics.classList.add('collapsed');
                            hymnToggle.textContent = '全文';
                        }
                    });
                } else {

                    hymnLyrics.classList.remove('collapsed');
                }
            }
        });
    });
</script>
</body>
</html>
